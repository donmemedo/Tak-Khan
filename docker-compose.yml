services:
  backend:
    build: ./backend
    volumes:
      - khana-data:/data
    ports:
      - "8046:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "3046:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  khana-data:
